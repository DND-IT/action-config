name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: smoke
    if: "!startsWith(github.head_ref, 'release-please--')"
    steps:
      - uses: actions/checkout@v6

      - id: config
        uses: ./
        with:
          config_path: .github/matrix-config.example.yaml

      - name: assert matrix output
        env:
          MATRIX: ${{ steps.config.outputs.matrix }}
        run: |
          echo "$MATRIX" | jq .
          echo "$MATRIX" | jq -e 'type == "array" and length > 0' > /dev/null
          echo "$MATRIX" | jq -e 'map(select(.service == "shared" and .environment == "dev")) | length == 0' > /dev/null
